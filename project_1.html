<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic1</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;--text:#f3f1ff;--muted:#b4afd6;--card:rgba(255,255,255,.08);--bd:rgba(255,255,255,.18);--ed:rgba(10,8,30,.65);--ok:#2ee6a6;--bad:#ff5d7a;--warn:#ffc857;--acc:#8b7bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#e9e4ff;--bg2:#d7e8ff;--bg3:#ffe3f1;--text:#1d1840;--muted:#5d5887;--card:rgba(255,255,255,.65);--bd:rgba(80,60,160,.2);--ed:rgba(255,255,255,.8);--ok:#0a9f6e;--bad:#d62f55;--warn:#b57a00;color-scheme:light}}
:root[data-theme="light"]{--bg1:#e9e4ff;--bg2:#d7e8ff;--bg3:#ffe3f1;--text:#1d1840;--muted:#5d5887;--card:rgba(255,255,255,.65);--bd:rgba(80,60,160,.2);--ed:rgba(255,255,255,.8);--ok:#0a9f6e;--bad:#d62f55;--warn:#b57a00;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;animation:flow 18s ease infinite;overflow-x:hidden;position:relative}
@keyframes flow{50%{background-position:100% 100%}}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:340px;height:340px;background:#7c5cff;top:-80px;left:-80px}
.b2{width:300px;height:300px;background:#ff5fa2;bottom:-60px;right:-60px;animation-delay:-5s}
.b3{width:240px;height:240px;background:#22d3ee;top:45%;left:55%;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 18px 40px}
.hidden{display:none!important}
.hero{text-align:center;padding:36px 0 26px}
.tag{display:inline-block;padding:6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:99px;font-size:.78rem;color:var(--muted);backdrop-filter:blur(8px)}
h1{font-size:clamp(2.2rem,7vw,3.8rem);font-weight:800;margin:16px 0 8px;background:linear-gradient(90deg,#a78bfa,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:560px;margin:0 auto;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}
.card{cursor:pointer;text-align:center;padding:30px 20px;border-radius:22px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);color:var(--text);font:inherit;transition:.25s}
.card:hover{transform:translateY(-8px);border-color:var(--acc);box-shadow:0 18px 40px rgba(124,92,255,.35)}
.card .ic{font-size:3rem}.card h2{margin:10px 0 4px;font-size:1.4rem}.card span{color:var(--muted);font-size:.85rem}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btn{font:600 .9rem 'Poppins',sans-serif;border:1px solid var(--bd);background:var(--card);color:var(--text);padding:10px 18px;border-radius:12px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
.btn:hover{border-color:var(--acc)}
.btn.main{background:linear-gradient(90deg,#7c5cff,#f472b6);border:0;color:#fff;box-shadow:0 8px 22px rgba(124,92,255,.4)}
.btn.main:hover{transform:translateY(-2px)}
.badge{font-weight:800;font-size:1.3rem;margin-right:auto}
.editor{display:flex;border-radius:18px;background:var(--ed);border:1px solid var(--bd);overflow:hidden;backdrop-filter:blur(10px)}
#nums{padding:14px 10px;text-align:right;color:var(--muted);font:400 13px/1.6 'JetBrains Mono',monospace;user-select:none;overflow:hidden;border-right:1px solid var(--bd);min-width:44px;white-space:pre}
textarea{flex:1;height:340px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:400 13px/1.6 'JetBrains Mono',monospace;padding:14px;white-space:pre;overflow:auto;tab-size:4}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
#result{border-radius:18px;padding:20px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(12px);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
#result.good{border-color:var(--ok);box-shadow:0 0 30px rgba(46,230,166,.25)}
#result.bad{border-color:var(--bad);box-shadow:0 0 30px rgba(255,93,122,.2)}
.sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.num{font-size:3rem;font-weight:800;line-height:1}
.good .num{color:var(--ok)}.bad .num{color:var(--bad)}
.sum b{font-size:1.15rem}.sum small{display:block;color:var(--muted)}
ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ed);border-left:4px solid var(--bad);font-size:.9rem}
li.w{border-left-color:var(--warn)}
li i{font:600 .78rem 'JetBrains Mono',monospace;font-style:normal;color:var(--acc);white-space:nowrap;padding-top:2px}
.note{margin-top:26px;text-align:center;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<section id="home">
  <div class="hero">
    <span class="tag">100% hand-written logic · zero AI inside</span>
    <h1>CodeChecker</h1>
    <p>Pick a language, paste your code, and find out instantly if it has errors, how many, and on which line.</p>
  </div>
  <div class="grid">
    <button class="card" data-lang="java"><div class="ic">☕</div><h2>Java</h2><span>Brackets, semicolons, strings, class</span></button>
    <button class="card" data-lang="python"><div class="ic">🐍</div><h2>Python</h2><span>Colons, indentation, brackets, strings</span></button>
    <button class="card" data-lang="html"><div class="ic">🌐</div><h2>HTML</h2><span>Unclosed tags, mismatches, attributes</span></button>
  </div>
</section>

<section id="checker" class="hidden">
  <div class="bar">
    <button class="btn" id="back">← Home</button>
    <div class="badge" id="badge"></div>
    <button class="btn" id="sample">Load sample</button>
  </div>
  <div class="editor"><div id="nums">1</div><textarea id="code" spellcheck="false" placeholder="Paste your code here…"></textarea></div>
  <div class="actions">
    <button class="btn main" id="run">⚡ Check Code</button>
    <button class="btn" id="clear">Clear</button>
  </div>
  <div id="result" class="hidden"></div>
</section>
<p class="note">Rule-based checker: it catches common syntax mistakes, but it is not a full compiler.</p>
</main>

<script>
const $=s=>document.querySelector(s);
const NAMES={java:'☕ Java',python:'🐍 Python',html:'🌐 HTML'};
const SAMPLES={
java:'public class Main {\n    public static void main(String[] args) {\n        int x = 5\n        String s = "hello;\n        System.out.println(x);\n    }\n',
python:'def greet(name)\n    print("Hi " + name)\n\nif 3 = 3:\n    x = (1 + 2\nfor i in range(3):\nprint(i)\n',
html:'<html>\n<body>\n  <div class=box>\n    <h1>Hello</h1>\n    <img src="a.png">\n    <p>Text <b>bold</i></p>\n</body>\n</html>'
};
let lang='java';

/* ---------- scanner: strips comments/strings, checks brackets ---------- */
function scan(code,py){
  const errs=[],st=[],n=code.length;let out='',i=0,line=1;
  while(i<n){
    const c=code[i],d=code.substr(i,2),t=code.substr(i,3);
    if(c==='\n'){out+=c;line++;i++;continue}
    if((py&&c==='#')||(!py&&d==='//')){while(i<n&&code[i]!=='\n')i++;continue}
    if(!py&&d==='/*'){const s=line;let ok=false;i+=2;
      while(i<n){if(code.substr(i,2)==='*/'){i+=2;ok=true;break}if(code[i]==='\n'){out+='\n';line++}i++}
      if(!ok)errs.push({line:s,msg:'Comment /* is never closed'});continue}
    if(t==='"""'||(py&&t==="'''")){const s=line;let ok=false;i+=3;
      while(i<n){if(code.substr(i,3)===t){i+=3;ok=true;break}if(code[i]==='\\'){i+=2;continue}if(code[i]==='\n'){out+='\n';line++}i++}
      out+='""';if(!ok)errs.push({line:s,msg:'Multi-line string is never closed'});continue}
    if(c==='"'||c==="'"){const s=line;let ok=false;i++;
      while(i<n&&code[i]!=='\n'){if(code[i]==='\\'){i+=(code[i+1]==='\n'?1:2);continue}if(code[i]===c){i++;ok=true;break}i++}
      out+='""';if(!ok)errs.push({line:s,msg:'String is not closed (missing '+c+')'});continue}
    if('([{'.includes(c))st.push({c,line});
    else if(')]}'.includes(c)){
      const o=st.pop(),pair={')':'(',']':'[','}':'{'};
      if(!o)errs.push({line,msg:'Extra closing "'+c+'" with no opening bracket'});
      else if(o.c!==pair[c])errs.push({line,msg:'Mismatch: "'+o.c+'" from line '+o.line+' is closed by "'+c+'"'});
    }
    out+=c;i++;
  }
  st.forEach(o=>errs.push({line:o.line,msg:'"'+o.c+'" is never closed'}));
  return{clean:out,errs};
}

/* ---------- Python ---------- */
function checkPython(code){
  const {clean,errs}=scan(code,true),lines=clean.split('\n');
  let depth=0,stack=[0],expect=false,opener=0;
  lines.forEach((raw,k)=>{
    const ln=k+1,text=raw.trim(),startDepth=depth;
    for(const ch of raw){if('([{'.includes(ch))depth++;else if(')]}'.includes(ch))depth=Math.max(0,depth-1)}
    if(!text||startDepth>0)return;
    const ws=raw.match(/^[ \t]*/)[0];
    if(ws.includes(' ')&&ws.includes('\t'))errs.push({line:ln,msg:'Mixed tabs and spaces in indentation'});
    const ind=ws.replace(/\t/g,'    ').length,top=stack[stack.length-1];
    if(expect){
      if(ind<=top)errs.push({line:ln,msg:'Expected an indented block after line '+opener});
      else stack.push(ind);
      expect=false;
    }else if(ind>top)errs.push({line:ln,msg:'Unexpected indent'});
    else if(ind<top){
      while(stack.length>1&&stack[stack.length-1]>ind)stack.pop();
      if(stack[stack.length-1]!==ind){errs.push({line:ln,msg:'Unindent does not match any outer indentation level'});stack.push(ind)}
    }
    if(/^(if|elif|else|for|while|def|class|try|except|finally|with|async\s+def)\b/.test(text)){
      if(!text.includes(':'))errs.push({line:ln,msg:'Missing colon ":" at the end of the statement'});
      else if(/:\s*$/.test(text)){expect=true;opener=ln}
      if(/^def\s+\w+\s*:/.test(text))errs.push({line:ln,msg:'Function definition is missing parentheses ()'});
    }
    if(/^(if|elif|while)\s+[^=!<>:]*[^=!<>:\s]\s*=\s*[^=]/.test(text))errs.push({line:ln,msg:'Use "==" to compare (single "=" assigns a value)'});
    if(/^print\s+[^(\s=]/.test(text))errs.push({line:ln,msg:'print needs parentheses: print(...)'});
  });
  if(expect)errs.push({line:opener,msg:'Expected an indented block, but the code ends here'});
  return errs;
}

/* ---------- Java ---------- */
function checkJava(code){
  const {clean,errs}=scan(code,false),lines=clean.split('\n'),ne=[];
  lines.forEach((l,k)=>{if(l.trim())ne.push({ln:k+1,t:l.trim()})});
  if(ne.length&&!/\b(class|interface|enum|record)\s+\w+/.test(clean))errs.push({line:1,msg:'No class declaration found (Java code must live inside a class)'});
  let pd=0;
  const ctl=/^(if|for|while|else|do|try|catch|finally|switch|synchronized)\b/;
  ne.forEach((o,idx)=>{
    const t=o.t,startPd=pd,prev=idx?ne[idx-1].t:'',next=idx<ne.length-1?ne[idx+1].t:'';
    for(const ch of t){if('(['.includes(ch))pd++;else if(')]'.includes(ch))pd=Math.max(0,pd-1)}
    if(/^(if|while)\s*\(.*[^=!<>]=[^=].*\)/.test(t)&&!/[=!<>]=/.test(t.replace(/[^=!<>]=[^=]/,'')))errs.push({line:o.ln,msg:'Use "==" to compare (single "=" assigns a value)'});
    if(/\bstring\s+\w+\s*[=;]/.test(t))errs.push({line:o.ln,msg:'Type should be "String" with a capital S'});
    if(/\bsystem\.out\b/.test(t))errs.push({line:o.ln,msg:'"System" must start with a capital S'});
    if(/\binteger\s+\w+\s*[=;]/.test(t))errs.push({line:o.ln,msg:'Use "int" (or "Integer") instead of "integer"'});
    if(startPd>0)return;
    if(/[;{}]$/.test(t)||/[,(&|+\-*\/=?:.<>]$/.test(t)||/^[@.+?:&|]/.test(t))return;
    if(/,$|=\s*\{$|\[\]\s*\{$/.test(prev))return;
    if(/^(else|do|try|finally)$/.test(t))return;
    if(ctl.test(t)&&/\)$/.test(t))return;
    if(next.startsWith('{')||/^throws\b/.test(next))return;
    errs.push({line:o.ln,msg:'Missing semicolon ";" at the end of the statement'});
  });
  return errs;
}

/* ---------- HTML ---------- */
function checkHTML(code){
  const errs=[],lineAt=i=>code.slice(0,i).split('\n').length;
  const VOID=new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));
  const OPT=new Set(['p','li','td','th','tr','dd','dt','option','thead','tbody','tfoot']);
  if(!/<[a-zA-Z]/.test(code)){return[{line:1,msg:'No HTML tags found'}]}
  if(code.lastIndexOf('<!--')>code.lastIndexOf('-->'))errs.push({line:lineAt(code.lastIndexOf('<!--')),msg:'Comment <!-- is never closed'});
  const re=/<!--[\s\S]*?-->|<![^>]*>|<(\/?)([a-zA-Z][\w:-]*)((?:"[^"]*"|'[^']*'|[^'">])*)(["']?[^>]*>?)/g;
  const stack=[],low=code.toLowerCase();let m;
  while((m=re.exec(code))){
    if(m[0][1]==='!')continue;
    const close=m[1]==='/',name=m[2].toLowerCase(),attrs=m[3],ln=lineAt(m.index);
    if(!m[4].endsWith('>'))errs.push({line:ln,msg:'Tag <'+name+'> is missing its closing ">" or has an unclosed quote'});
    if(close){
      if(VOID.has(name)){errs.push({line:ln,msg:'</'+name+'> is not needed, <'+name+'> has no closing tag'});continue}
      const k=stack.map(s=>s.n).lastIndexOf(name);
      if(k<0)errs.push({line:ln,msg:'Closing tag </'+name+'> has no matching opening tag'});
      else{
        while(stack.length-1>k){const u=stack.pop();if(!OPT.has(u.n))errs.push({line:u.l,msg:'<'+u.n+'> is not closed properly (found </'+name+'> on line '+ln+' first)'})}
        stack.pop();
      }
    }else{
      const self=/\/\s*$/.test(attrs);
      if(!VOID.has(name)&&!self)stack.push({n:name,l:ln});
      const a=attrs.replace(/"[^"]*"|'[^']*'/g,'""');
      if(/=\s*[^\s"']/.test(a))errs.push({line:ln,msg:'Attribute value in <'+name+'> should be wrapped in quotes',warn:true});
      if(name==='img'&&!/\balt\s*=/i.test(attrs))errs.push({line:ln,msg:'<img> is missing an alt attribute',warn:true});
      if(name==='script'||name==='style'){
        const e=low.indexOf('</'+name,re.lastIndex);
        if(e<0){errs.push({line:ln,msg:'<'+name+'> is never closed'});stack.pop();break}
        re.lastIndex=e;
      }
    }
  }
  stack.forEach(u=>{if(!OPT.has(u.n))errs.push({line:u.l,msg:'<'+u.n+'> is never closed'})});
  if(/<html/i.test(code)&&!/<!doctype/i.test(code))errs.push({line:1,msg:'Missing <!DOCTYPE html> at the top',warn:true});
  return errs;
}

/* ---------- UI ---------- */
function show(view){$('#home').classList.toggle('hidden',view!=='home');$('#checker').classList.toggle('hidden',view!=='checker')}
function nums(){const n=$('#code').value.split('\n').length;$('#nums').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang;$('#badge').textContent=NAMES[lang]+' Checker';
  $('#code').value='';$('#result').classList.add('hidden');nums();show('checker');window.scrollTo(0,0)});
$('#back').onclick=()=>show('home');
$('#clear').onclick=()=>{$('#code').value='';$('#result').classList.add('hidden');nums()};
$('#sample').onclick=()=>{$('#code').value=SAMPLES[lang];nums();$('#result').classList.add('hidden')};
$('#code').addEventListener('input',nums);
$('#code').addEventListener('scroll',e=>{$('#nums').scrollTop=e.target.scrollTop});
$('#run').onclick=()=>{
  const code=$('#code').value,box=$('#result');
  box.classList.remove('hidden','good','bad');
  if(!code.trim()){box.className='';box.innerHTML='<b>Paste some code first 🙂</b>';return}
  let all=lang==='java'?checkJava(code):lang==='python'?checkPython(code):checkHTML(code);
  all.sort((a,b)=>a.line-b.line);
  const errors=all.filter(e=>!e.warn),warns=all.filter(e=>e.warn);
  box.className=errors.length?'bad':'good';
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let h='<div class="sum"><div class="num">'+errors.length+'</div><div><b>'+
    (errors.length?(errors.length===1?'1 error found ❌':errors.length+' errors found ❌'):'0 errors – your code looks correct ✅')+
    '</b><small>'+(warns.length?warns.length+' warning'+(warns.length>1?'s':'')+' · ':'')+NAMES[lang]+' check complete</small></div></div>';
  if(all.length)h+='<ul>'+all.map(e=>'<li class="'+(e.warn?'w':'')+'"><i>Line '+e.line+'</i><span>'+(e.warn?'⚠️ ':'')+esc(e.msg)+'</span></li>').join('')+'</ul>';
  box.innerHTML=h;box.scrollIntoView({behavior:'smooth',block:'nearest'});
};
</script>
</body>
</html>
